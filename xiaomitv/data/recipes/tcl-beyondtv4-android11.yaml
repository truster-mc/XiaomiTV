id: tcl-beyondtv4-android11
title: TCL 43P635 Google TV (codename BeyondTV4), Android 11
models: [BeyondTV4, 43P635]
android: ["11"]
summary: >-
  Five steps, safest first: Google extras, TCL apps that owners report removing, the remote-button
  partner apps, the Assistant and accessibility apps, then a manual launcher swap. Tested on one
  TCL 43P635 with 2 GB of RAM: free memory went from 403 MB to about 480 MB, and swap use fell from
  about 600 MB to about 54 MB. Test the HDMI inputs, power button and remote after every step.
result:
  before_mb: 403
  after_mb: 480
  note: >-
    Kernel MemAvailable 7 minutes after a reboot with nothing opened, against 403 MB at the first scan,
    which was taken during a Play Store update and compile burst. Swap in use fell from about 600 MB
    to about 54 MB. Measured on one TV, so treat the numbers as a guide.
steps:
  - title: "1. Google extras (safe)"
    notes: >-
      Setup leftovers, error reports, calendar sync, games, movies, printing and screensavers. They
      free almost no memory but are safe to remove. After this step reboot and test the HDMI inputs
      (Source button), the power button, the remote, sound, YouTube and Netflix.
    packages:
      - com.google.android.partnersetup
      - com.google.android.onetimeinitializer
      - com.google.android.feedback
      - com.google.android.syncadapters.calendar
      - com.google.android.play.games
      - com.google.android.youtube.tvmusic
      - com.google.android.videos
      - com.android.printspooler
      - com.android.dreams.basic
  - title: "2. TCL apps owners report removing (trade-offs)"
    notes: >-
      From one owner's list of apps the TV works without, from the 50P725 guide, and from other posts.
      What each app does is mostly inferred from its name, and micmanager may affect the remote's voice
      button (not tested). One was checked by decompiling: t_solo is the Bluetooth "Listen Alone"
      feature (private listening on Bluetooth headphones), not telemetry, so disabling it only matters
      if you use that. Apply in two batches and test the HDMI inputs, power button, remote, YouTube
      and sound after each. All 15 applied here without a problem.
    packages:
      - com.tcl.dashboard
      - com.tcl.esticker
      - com.tcl.gallery
      - com.tcl.ui_mediaCenter
      - com.tcl.imageplayer
      - com.tcl.videoplayer
      - com.tcl.micmanager
      - com.tcl.notereminder
      - com.tcl.t_solo
      - com.tcl.useragreement
      - com.tcl.usercenter
      - com.tcl.MultiScreenInteraction_TV
      - com.tcl.pvr.pvrplayer
      - com.tcl.messagebox
      - com.tcl.smartalexa
  - title: "3. Remote-button partner apps (trade-offs)"
    notes: >-
      TCL's partner customizer drives the remote's TCL Channel, Okko and Kinopoisk buttons, and Prime
      Video has its own button. Disable, do not uninstall, so the buttons can be remapped. Netflix is not
      in this list on purpose: disabling it freed 100 to 160 MB while it was open, but the remote's Netflix
      button stops working, and the owner turned it back on. Add com.netflix.ninja by hand if you never
      use that button.
    packages:
      - com.tcl.partnercustomizer
      - com.tcl.partnercustomizer.resource
      - com.amazon.amazonvideo.livingroom
  - title: "4. Assistant, accessibility and screensaver (trade-offs)"
    notes: >-
      Disabling the Google Assistant makes the remote's microphone button and voice search stop
      working. Only do this if nobody uses voice. TalkBack is the screen reader and TTS is Google's
      speech service. These three freed little on their own. Ambient Mode (dreamx) is Google's
      screensaver provider and held about 25 to 50 MB; with it off the TV has no screensaver (the basic
      one is already off in step 1) and stays on the home screen until it sleeps. Disabled on a second
      TV with no problem seen, but sleep afterwards was not tested.
    packages:
      - com.google.android.katniss
      - com.google.android.marvin.talkback
      - com.google.android.tts
      - com.google.android.apps.tv.dreamx
  - title: "5. By hand: Play Store auto-update and the launcher"
    notes: >-
      Play Store: open it on the TV, then Settings, Auto-update apps, Don't auto-update apps. On the
      first scan its background updater held 257 MB while a compile job used 225 MB. Launcher: install an
      official Projectivy Launcher from the Play Store or the developer's GitHub release, not a modified
      build, and enable its accessibility service. Then back up and disable
      com.google.android.apps.tv.launcherx together with com.google.android.tungsten.setupwraith (the tool
      needs the --force launch flag). The Google launcher plus its core services used about 270 to 330 MB.
      Home then resolves straight to Projectivy. Reboot and test everything again. The four undocumented
      background services (com.tcl.bi, com.tcl.versionUpdateApp, com.tcl.xian.StartandroidService,
      com.tcl.overseasappshow, about 55 MB together) are not ticked. Decompiling two of them (bi and xian)
      and com.tcl.guard showed: com.tcl.bi is TCL's usage analytics (it logs the foreground app, a list of
      remote key presses, app installs and removals, and device ids such as MAC and Android ID), so it
      is the best candidate to disable. It is selectable in the app list as a trade-off. com.tcl.guard (Safety Guard) is a memory killer, junk
      cleaner and permission shield that also reports app package names and kill events to TCL; it is
      not ticked because its permission shield was not tested. On the tested TV it was already
      disabled when the recipe was first scanned, yet after a reboot it was still running (a persistent
      system process, about 18 MB PSS), so disabling it does not stop it or its reports. com.tcl.xian.StartandroidService is the
      TV's activation and login client for TCL's cloud, other TCL services wait for its login broadcast,
      so leave it. It also accepts any TLS certificate and exports its token database to every app. Not
      decompiled: versionUpdateApp (system updates) and overseasappshow.
    manual: true
    packages:
      - com.google.android.apps.tv.launcherx
      - com.google.android.tungsten.setupwraith
tried_and_failed:
  - >-
    The load average is meaningless on this TV: it read about 26 from the first minute after boot to seven
    minutes later while the CPUs were 85 to 93 percent idle. Do not judge the TV by it. Judge by free
    memory, swap use and how it feels.
  - >-
    The first scan was taken during a Play Store update and compile burst (free memory 403 MB, swap about
    600 MB used). Measure after a reboot and wait five minutes with nothing open, and scan again.
  - >-
    A sideloaded Projectivy v4.72 build used 12 to 59 percent of a core while idle and grew from about 200
    to 238 MB RSS in seven minutes. It is not clear if that is the build or its wallpaper and animation
    settings. An official build is recommended, and check its wallpaper and animated-icon settings.
  - >-
    The decompiled findings come from reading jadx output, not from watching the TV's traffic, so "logs"
    and "reports" here mean the code is built to do it, not that traffic was seen. com.tcl.bi's upload hosts are not readable in the code.
    Disabling com.tcl.bi was done on the tested TV but only checked for a running process and the
    foreground app, not for HDMI, power button or remote. com.tcl.guard was already disabled on that TV
    before any change was made. After a reboot its package was still disabled but its process was running,
    started at boot because it is a persistent system app, so disabling it does not free its memory.
    Stopping it would need root or a force-stop after every boot, and force-stop does not survive a reboot.
  - >-
    Not tested: whether the remote's voice button works with micmanager and the Assistant disabled.
undo:
  - "One app: adb shell pm enable --user 0 <package>"
  - "Everything in a step: use the Backups list in the page (it only lists this TV's backups) and press Restore."
  - "Google launcher: pm enable --user 0 com.google.android.apps.tv.launcherx and com.google.android.tungsten.setupwraith, then reboot."
