# Knowledge base: package -> rating (safe | tradeoff | keep) and why.
# Sources: 4pda "Xiaomi MI TV A2" thread (shtopor-89, meth_lab), Habr Mi TV write-up,
# checked against a scan of MiTV-MOOR2. Packages not listed are treated as "keep".

# ---- safe: telemetry, promo, setup leftovers ----
com.miui.tv.analytics:
  rating: safe
  reason: Xiaomi analytics service; only collects usage data.
com.xiaomi.statistic:
  rating: safe
  reason: Xiaomi statistics collector.
com.mitv.tvhome.michannel:
  rating: safe
  reason: PatchWall channel recommendations; useless when PatchWall is unused.
com.mitv.tvhome.mitvplus:
  rating: safe
  reason: Xiaomi TV+ recommendation app; only foreign channels.
com.xiaomi.floatingframe:
  rating: safe
  reason: Store demo ("exhibition") mode.
com.google.android.onetimeinitializer:
  rating: safe
  reason: Only runs during first-time setup.
com.mstar.android.tv.disclaimercustomization:
  rating: safe
  reason: Vendor disclaimer text, only used in demo mode.
com.google.android.play.games:
  rating: safe
  reason: Play Games; can be installed from the store if ever needed.
com.google.android.videos:
  rating: safe
  reason: Google Play Movies; can be reinstalled from the store.
com.google.android.youtube.tvmusic:
  rating: safe
  reason: Just a shortcut that opens YouTube on its Music tab.
com.mitv.tvhome.atv:
  rating: safe
  needs_other_launcher: true
  reason: PatchWall launcher with ads and recommendations; slows the TV down.
com.xiaomi.mitv.updateservice:
  rating: safe
  reason: Background update service for the PatchWall launcher.
com.google.android.feedback:
  rating: safe
  reason: Sends error reports to Google; not needed to use the TV.
com.google.android.syncadapters.calendar:
  rating: safe
  reason: Only needed for Google Calendar sync.
com.android.printspooler:
  rating: safe
  reason: Printing service; the TV has no print settings.
com.android.dreams.basic:
  rating: safe
  reason: Adds a plain-colour screensaver option; forum calls it useless.

# ---- tradeoff: works, but something stops working ----
com.google.android.tv.remote.service:
  rating: tradeoff
  reason: Lets a phone act as the remote.
  tradeoff: The phone remote app and pairing new Bluetooth devices stop working.
com.mitv.milinkservice:
  rating: tradeoff
  reason: UPnP casting from Xiaomi phones.
  tradeoff: Casting audio/video from Xiaomi apps stops working.
com.xiaomi.mitv.smartshare:
  rating: tradeoff
  reason: Miracast screen mirroring.
  tradeoff: Mirroring a phone screen to the TV stops working.
com.google.android.katniss:
  rating: tradeoff
  reason: Google Assistant voice search; uses about 60-100 MB of RAM.
  tradeoff: The remote's microphone button and voice search stop working. Only disable if you never use voice search.
com.mitv.dream:
  rating: tradeoff
  reason: Screensaver showing movie posters.
  tradeoff: That screensaver is gone.
com.google.android.tts:
  rating: tradeoff
  reason: Google Speech Services; reportedly not needed for search results.
  tradeoff: Text-to-speech in some apps and accessibility may stop.
com.netflix.ninja:
  rating: tradeoff
  button_bound: true
  reason: Netflix; the remote has a Netflix button.
  tradeoff: Netflix is gone. Disable only (do not uninstall) if the remote button is remapped.
com.amazon.amazonvideo.livingroom:
  rating: tradeoff
  button_bound: true
  reason: Prime Video; the remote has a Prime Video button.
  tradeoff: Prime Video is gone. Disable only (do not uninstall) if the remote button is remapped.
ru.mts.mtstv:
  rating: tradeoff
  button_bound: true
  reason: KION streaming app tied to a remote button.
  tradeoff: KION is gone; its remote button stops working.
tv.more.play:
  rating: tradeoff
  button_bound: true
  reason: Okko streaming app tied to a remote button.
  tradeoff: Okko is gone; its remote button stops working.
ru.rt.video.app.tv:
  rating: tradeoff
  button_bound: true
  reason: Wink streaming app tied to a remote button.
  tradeoff: Wink is gone; its remote button stops working.
ru.rutube.app:
  rating: tradeoff
  button_bound: true
  reason: Rutube app.
  tradeoff: Rutube is gone.
com.vk.tv:
  rating: tradeoff
  button_bound: true
  reason: VK Video app.
  tradeoff: VK Video is gone.
com.google.android.tungsten.setupwraith:
  rating: tradeoff
  reason: First-time setup wizard (about 20 MB while running); forum says it can be disabled.
  tradeoff: A forum post says this wizard can act as a fallback launcher. If the TV shows no home screen after a reboot, restore from the backup.
com.google.android.marvin.talkback:
  rating: tradeoff
  reason: TalkBack screen reader for accessibility; not running.
  tradeoff: The screen reader is gone. Only disable if nobody uses it.

# ---- keep: breaks the TV if disabled ----
com.google.android.apps.tv.launcherx:
  rating: keep
  reason: Google TV home screen.
com.google.android.tvlauncher:
  rating: keep
  reason: Android TV Home launcher.
com.mitv.livetv:
  rating: keep
  reason: Live TV; also manages the HDMI inputs.
com.mitv.livetv.ci_mediatek:
  rating: keep
  reason: Live TV CI module support.
com.mitv.livetv.ci.mediatek:
  rating: keep
  reason: Live TV CI module support.
com.mediatek.wwtv.tvcenter:
  rating: keep
  reason: Live TV; also manages the HDMI inputs.
com.mediatek.wwtv.setupwizard:
  rating: keep
  reason: Live TV channel search and setup.
com.xiaomi.android.tvsetup.partnercustomizer:
  rating: keep
  reason: Remote streaming buttons, region and inputs tile.
com.xm.webcontent:
  rating: keep
  reason: Helper for screen casting and YouTube.
com.mitv.overseaservice:
  rating: keep
  reason: Controls the status LED under the power button.
com.mitv.videoplayer:
  rating: keep
  reason: Built-in video player.
com.xiaomi.mimusic2:
  rating: keep
  reason: Built-in music player.
com.mitv.gallery:
  rating: keep
  reason: Built-in gallery.
com.xiaomo.tv.milegal:
  rating: keep
  reason: Factory menu and license text.
com.google.android.gms:
  rating: keep
  reason: Google Play Services.
com.google.android.webview:
  rating: keep
  reason: System WebView.
com.google.android.inputmethod.latin:
  rating: keep
  reason: On-screen keyboard.
com.android.tv.settings:
  rating: keep
  reason: System settings.
com.xiaomi.gtv.settings:
  rating: keep
  reason: Xiaomi settings additions.
com.android.systemui:
  rating: keep
  reason: System UI.
com.mediatek.tvinput:
  rating: keep
  reason: TV input framework.
com.xiaomi.mitv.tvmanager:
  rating: keep
  reason: TV Manager; memory cleaner and permissions manager. Forum advises leaving it.
com.xiaomi.mitv.mediaexplorer:
  rating: keep
  reason: Media browser tied to the gallery, video and music players.
com.mediatek.tv.service:
  rating: keep
  reason: Mediatek TV framework service. Disabling it left the HDMI inputs (PS5, Steam machine) with a black screen on a MiTV-MOOR2.

# ---- TCL (BeyondTV4 / P725 family), sources: 4pda TCL thread, tv.cobanov.dev ----
com.google.android.partnersetup:
  rating: safe
  reason: Google partner setup leftovers; TCL owners disable it with no reported problems.
com.tcl.gallery:
  rating: tradeoff
  reason: TCL gallery app. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: The TCL gallery is gone.
com.tcl.ui_mediaCenter:
  rating: tradeoff
  reason: TCL media center app. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: The TCL media center is gone.
com.tcl.dashboard:
  rating: tradeoff
  reason: TCL dashboard app. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Unknown; check the home screen and settings still work.
com.tcl.imageplayer:
  rating: tradeoff
  reason: TCL image player. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Opening photos from USB with the TCL player stops working.
com.tcl.videoplayer:
  rating: tradeoff
  reason: TCL video player. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Playing local or USB video with the TCL player stops working.
com.tcl.micmanager:
  rating: tradeoff
  reason: TCL microphone manager. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Unknown; check the remote's voice button and any voice features.
com.tcl.t_solo:
  rating: tradeoff
  reason: TCL Bluetooth "Listen Alone" (package com.tcl.bluetoothlistenalone); decompiled. Reported removable by owners of the TCL P725 family (4pda).
  tradeoff: Private listening on Bluetooth headphones through the TV stops working.
com.tcl.useragreement:
  rating: tradeoff
  reason: TCL user agreement screens (setup). Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Agreement screens may show again if the TV is reset.
com.tcl.usercenter:
  rating: tradeoff
  reason: TCL user/account center. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: TCL account features stop working.
com.tcl.messagebox:
  rating: tradeoff
  reason: TCL message box. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: TCL on-screen messages stop.
com.tcl.smartalexa:
  rating: tradeoff
  reason: TCL Alexa integration. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Alexa on the TV stops working.
com.tcl.esticker:
  rating: tradeoff
  reason: TCL e-sticker (electronic label) app. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: The TV store-label overlay is gone.
com.tcl.notereminder:
  rating: tradeoff
  reason: TCL note and reminder app. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: TCL reminders are gone.
com.tcl.MultiScreenInteraction_TV:
  rating: tradeoff
  reason: TCL multi-screen (phone-to-TV) interaction. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Phone-to-TV casting through TCL's app stops working.
com.tcl.pvr.pvrplayer:
  rating: tradeoff
  reason: TCL PVR recording player. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Recording and playing back TV recordings stops working.
com.tcl.inputmethod.international:
  rating: tradeoff
  reason: TCL on-screen keyboard. Reported removable by owners of the TCL P725 family (4pda); what it does is only inferred from its name.
  tradeoff: Typing may fall back to another keyboard; keep it if you use no other.
com.tcl.partnercustomizer:
  rating: tradeoff
  reason: TCL partner customizer; sets up the remote's streaming buttons and TCL Channel recommendations.
  tradeoff: The remote's TCL Channel, Okko and Kinopoisk buttons and the TCL Channel recommendations stop working.
com.tcl.partnercustomizer.resource:
  rating: tradeoff
  reason: Resources for the TCL partner customizer.
  tradeoff: Goes with com.tcl.partnercustomizer; the same remote buttons are affected.
com.tcl.tv:
  rating: keep
  reason: TCL TV service. Disabling it breaks the TV's power button.
com.tcl.tvinput:
  rating: keep
  reason: TCL HDMI and antenna input service.
com.tcl.bi:
  rating: tradeoff
  reason: TCL usage analytics; decompiled. Logs the foreground app, a list of remote key presses, app installs and removals, and device ids (MAC, Android ID). Starts at boot.
  tradeoff: TCL loses its usage statistics. Nothing visible should change, but disabling it was not tested on the TV.
com.tcl.suspension:
  rating: keep
  reason: Runs the remote's Inputs/Source menu. Disabling it removes HDMI switching.
com.tcl.ttvs:
  rating: keep
  reason: Handles system updates over network and USB. The name is misleading; disabling it silently breaks updates.
com.tcl.tcl_bt_rcu_service:
  rating: keep
  reason: The remote's Bluetooth connection.
com.tcl.autopair:
  rating: keep
  reason: Automatic remote pairing.
com.android.location.fused:
  rating: keep
  reason: One source says disabling it sends the TV into a boot loop.
com.google.android.gsf:
  rating: keep
  reason: Google Services Framework; needed by Play Services.
com.tcl.system.server:
  rating: keep
  reason: TCL system service. One owner removed it without problems and others keep it, so it stays locked.
com.tcl.factory.view:
  rating: keep
  reason: TCL factory menu. Owners disagree on removing it, so it stays locked.
com.tcl.providers.config:
  rating: keep
  reason: TCL configuration provider.
com.tcl.settings:
  rating: keep
  reason: TCL settings additions.
com.tcl.initsetup:
  rating: keep
  reason: TCL first-run setup; may be needed after a reset.
com.tvos:
  rating: keep
  reason: TCL TV operating layer.
com.tcl.android.webview:
  rating: keep
  reason: TCL WebView.
